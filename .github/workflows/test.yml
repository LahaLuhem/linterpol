name: Test

on:
  pull_request:
  # Main too: a PR's test ran against the main it branched from, not always the main it lands on.
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The same scripts/test.sh you run locally, so CI and local can't drift. A step per target shows
  # which part failed.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint (dogfood the lean image's linters)
        run: ./scripts/test.sh lint

      - name: Structure-test the images
        run: ./scripts/test.sh structure

      - name: Validate OCI media types (lean)
        run: ./scripts/test.sh oci
