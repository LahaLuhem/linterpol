name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Always run on pull requests. On a push to main, skip if the pushed commit came from
  # a merged PR (already tested on the PR) but run for a direct push. Uses the commit/PR
  # association, so it's independent of the merge strategy (merge commit, squash, rebase).
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'push' ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "$GITHUB_SHA came from a PR; skipping (already tested on the PR)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Build all images, prove LINTERS.md is in sync with the Dockerfiles, then dogfood them:
  # structure-test the lean image with its own container-structure-test and the jvm + dotnet siblings
  # via the lean image's (the siblings carry no c-s-t), and lint this repo's own sources with the lean
  # image's tools (not the runner). actionlint runs shellcheck on the workflows' run: blocks too.
  selftest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      LINTERPOL_IMAGE: linterpol:local
      JVM_IMAGE: linterpol-jvm:local
      DOTNET_IMAGE: linterpol-dotnet:local
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: LINTERS.md is generated from the Dockerfiles
        run: ./scripts/gen-linters.sh --check

      - name: Build the images (lean + jvm + dotnet)
        run: ./scripts/build.sh

      # Structure-test the freshly built lean image with its own container-structure-test (tar
      # driver, so no Docker socket needed): asserts the tools are on PATH and the image's contract
      # (non-root lint user, /work workdir, no entrypoint). See tests/image-structure.yaml.
      - name: Structure-test the lean image (container-structure-test)
        run: |
          docker save "$LINTERPOL_IMAGE" -o "$RUNNER_TEMP/image.tar"
          chmod 0644 "$RUNNER_TEMP/image.tar"
          docker run --rm \
            -v "$RUNNER_TEMP/image.tar:/img/image.tar:ro" \
            -v "$PWD:/work:ro" \
            "$LINTERPOL_IMAGE" \
            container-structure-test test --driver tar -i /img/image.tar -c /work/tests/image-structure.yaml

      # The jvm sibling carries no container-structure-test of its own, so run the lean image's
      # against the jvm image's tarball. Asserts java + ktlint on PATH and the same contract.
      - name: Structure-test the jvm image (via the lean image's container-structure-test)
        run: |
          docker save "$JVM_IMAGE" -o "$RUNNER_TEMP/jvm.tar"
          chmod 0644 "$RUNNER_TEMP/jvm.tar"
          docker run --rm \
            -v "$RUNNER_TEMP/jvm.tar:/img/image.tar:ro" \
            -v "$PWD:/work:ro" \
            "$LINTERPOL_IMAGE" \
            container-structure-test test --driver tar -i /img/image.tar -c /work/tests/image-structure-jvm.yaml

      # The dotnet sibling likewise carries no container-structure-test, so run the lean image's
      # against its tarball. Asserts csharpier + the dotnet host on PATH and the same contract.
      - name: Structure-test the dotnet image (via the lean image's container-structure-test)
        run: |
          docker save "$DOTNET_IMAGE" -o "$RUNNER_TEMP/dotnet.tar"
          chmod 0644 "$RUNNER_TEMP/dotnet.tar"
          docker run --rm \
            -v "$RUNNER_TEMP/dotnet.tar:/img/image.tar:ro" \
            -v "$PWD:/work:ro" \
            "$LINTERPOL_IMAGE" \
            container-structure-test test --driver tar -i /img/image.tar -c /work/tests/image-structure-dotnet.yaml

      - name: Lint Dockerfiles (hadolint)
        run: docker run --rm -v "$PWD:/work:ro" "$LINTERPOL_IMAGE" hadolint images/lean/Dockerfile images/jvm/Dockerfile images/dotnet/Dockerfile

      - name: Lint shell scripts (shellcheck)
        run: docker run --rm -v "$PWD:/work:ro" "$LINTERPOL_IMAGE" shellcheck scripts/*.sh

      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/work:ro" "$LINTERPOL_IMAGE" actionlint
