name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Always run on pull requests. On a push to main, skip if the pushed commit came from
  # a merged PR (already tested on the PR) but run for a direct push. Uses the commit/PR
  # association, so it's independent of the merge strategy (merge commit, squash, rebase).
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'push' ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "$GITHUB_SHA came from a PR; skipping (already tested on the PR)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Build the image, prove LINTERS.md is in sync with the Dockerfile, then dogfood it: structure-test
  # the image with its own container-structure-test, and lint this repo's own sources with the tools
  # from the image (not the runner). actionlint runs shellcheck on the workflows' run: blocks too.
  selftest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      LINTERPOL_IMAGE: linterpol:local
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: LINTERS.md is generated from the Dockerfile
        run: ./scripts/gen-linters.sh --check

      - name: Build the image
        run: ./scripts/build.sh

      # Structure-test the freshly built image with its own container-structure-test (tar driver,
      # so no Docker socket needed): asserts the four tools are on PATH and the image's contract
      # (non-root lint user, /work workdir, no entrypoint). See tests/image-structure.yaml.
      - name: Structure-test the image (container-structure-test)
        run: |
          docker save "$LINTERPOL_IMAGE" -o "$RUNNER_TEMP/image.tar"
          chmod 0644 "$RUNNER_TEMP/image.tar"
          docker run --rm \
            -v "$RUNNER_TEMP/image.tar:/img/image.tar:ro" \
            -v "$PWD:/work:ro" \
            "$LINTERPOL_IMAGE" \
            container-structure-test test --driver tar -i /img/image.tar -c /work/tests/image-structure.yaml

      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -v "$PWD:/work:ro" "$LINTERPOL_IMAGE" hadolint Dockerfile

      - name: Lint shell scripts (shellcheck)
        run: docker run --rm -v "$PWD:/work:ro" "$LINTERPOL_IMAGE" shellcheck scripts/*.sh

      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/work:ro" "$LINTERPOL_IMAGE" actionlint
