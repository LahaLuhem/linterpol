name: Build & Publish

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Matrix of images (lean + jvm + dotnet), each a single-job multi-arch build: the images only land prebuilt
# per-arch binaries (Lane-1 COPY --from upstreams, Lane-2 downloads done on the build arch), so the
# sole emulated step per image is a one-line useradd and a native-runner matrix isn't worth it
# (see APPENDIX.md#single-job-buildx). Publish only on main pushes or a manual run; pull requests
# build-validate both arches without pushing. The :latest tags are shared, so gating pushes keeps
# branches from clobbering them. Verify a branch without merging:
#   gh workflow run build_and_push.yml --ref <branch>

# Serialize whole publish runs per ref so concurrent runs don't race on the shared :latest tags.
# (The matrix legs push different tags, so they run in parallel within a run.) Don't cancel an
# in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lean
            image: ghcr.io/lahaluhem/linterpol
            dockerfile: images/lean/Dockerfile
            title: Linterpol
            description: "Combined CI lint tools: hadolint, actionlint, shellcheck, ruff, biome, swiftlint, rumdl, ryl, container-structure-test."
          - variant: jvm
            image: ghcr.io/lahaluhem/linterpol-jvm
            dockerfile: images/jvm/Dockerfile
            title: Linterpol JVM
            description: "JVM-stack CI lint tools: ktlint."
          - variant: dotnet
            image: ghcr.io/lahaluhem/linterpol-dotnet
            dockerfile: images/dotnet/Dockerfile
            title: Linterpol .NET
            description: ".NET-stack CI lint tools: CSharpier."
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # arm64 is the only emulated platform (amd64 is native to the runner); the steps that run in
      # the arm64 rootfs are trivial (each image's one-line useradd, plus lean's Lane-2
      # download-verifies; the jvm image fetches ktlint and the dotnet image installs CSharpier on
      # the native build arch).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tags + OCI labels + OCI annotations (index and manifest level) from the build
      # context. This is the single source of truth for image metadata; the Dockerfiles carry no
      # LABELs. title/description are curated per variant (the matrix); source/revision/created/
      # version/licenses fill in automatically from the repo and the build commit.
      - name: Docker metadata (tags, labels, annotations)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ matrix.image }}
          tags: type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest

      # On publish runs this pushes the multi-arch index; on pull requests push=false, so both
      # arches build (validation) but nothing is pushed. oci-mediatypes=true makes the pushed index,
      # manifests, config, and layers use OCI media types instead of Docker schema 2.
      - name: Build (and push on publish runs)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          outputs: type=image,oci-mediatypes=true,push=${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      # A publish is only "done" when the manifest carries both arches (hard rule 8) and the index
      # uses the OCI media type (the point of oci-mediatypes=true above), so a regression back to
      # Docker schema 2 fails the run.
      - name: Verify the published index (both arches + OCI media type)
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          inspect="$(docker buildx imagetools inspect "$IMAGE:latest")"
          echo "$inspect"
          for plat in linux/amd64 linux/arm64; do
            if ! grep -qF "$plat" <<<"$inspect"; then
              echo "ERROR: published manifest is missing $plat" >&2
              exit 1
            fi
          done
          raw="$(docker buildx imagetools inspect "$IMAGE:latest" --raw)"
          if ! grep -qF 'application/vnd.oci.image.index.v1+json' <<<"$raw"; then
            echo "ERROR: published index is not an OCI image index (media type)" >&2
            exit 1
          fi
          echo "OK: OCI index carries linux/amd64 + linux/arm64"
