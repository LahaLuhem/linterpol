name: Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

# Matrix of images (lean + jvm + dotnet), each a single-job multi-arch build: the images only land prebuilt
# per-arch binaries (Lane-1 COPY --from upstreams, Lane-2 downloads done on the build arch), so the
# sole emulated step per image is a one-line useradd and a native-runner matrix isn't worth it
# (see APPENDIX.md#single-job-buildx).
#
# Only a version tag publishes (APPENDIX.md#versioning-releases); main pushes and PRs build-validate
# both arches without pushing. Validate a branch without merging:
#   gh workflow run build_and_push.yml --ref <branch>

# Serialize publish runs per ref so they don't race on the moving tags (`latest`, `1`, `1.2`). Matrix
# legs push different images, so they still run in parallel. Don't cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lean
            image: ghcr.io/lahaluhem/linterpol
            dockerfile: images/lean/Dockerfile
            title: Linterpol
            description: "Common-stack CI lint tools."
          - variant: jvm
            image: ghcr.io/lahaluhem/linterpol-jvm
            dockerfile: images/jvm/Dockerfile
            title: Linterpol JVM
            description: "JVM-stack CI lint tools."
          - variant: dotnet
            image: ghcr.io/lahaluhem/linterpol-dotnet
            dockerfile: images/dotnet/Dockerfile
            title: Linterpol .NET
            description: ".NET-stack CI lint tools."
    env:
      # Tag refs publish (push or `gh workflow run … --ref 1.2.3`); branch refs build-validate.
      PUBLISH: ${{ github.ref_type == 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # arm64 is the only emulated platform (amd64 is native to the runner); the steps that run in
      # the arm64 rootfs are trivial (each image's one-line useradd, plus lean's Lane-2
      # download-verifies; the jvm image fetches ktlint and the dotnet image installs CSharpier on
      # the native build arch).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tags + OCI labels + OCI annotations (index and manifest level) from the build
      # context. This is the single source of truth for image metadata; the Dockerfiles carry no
      # LABELs. title/description are curated per variant (the matrix); source/revision/created/
      # version/licenses fill in automatically from the repo and the build commit.
      # Tag `1.2.3` publishes 1.2.3 + 1.2 + 1 + latest; `latest` comes free from the default
      # `flavor: latest=auto`. The `ref` entries only name non-publishing builds (`main`, `pr-42`).
      - name: Docker metadata (tags, labels, annotations)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest

      # On publish runs this pushes the multi-arch index; on pull requests push=false, so both
      # arches build (validation) but nothing is pushed. oci-mediatypes=true makes the pushed index,
      # manifests, config, and layers use OCI media types instead of Docker schema 2.
      - name: Build (and push on publish runs)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          outputs: type=image,oci-mediatypes=true,push=${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      # A publish is only "done" when the pushed image carries both arches (hard rule 8) and uses
      # OCI media types end to end. assert_oci_registry.sh checks the index, both arches, and every
      # manifest/config/layer; crane then validates the image is well-formed and pullable. Both target
      # the version tag (what consumers pin); the digest match proves `latest` moved onto this release.
      - name: Install crane
        if: env.PUBLISH == 'true'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Verify the published image (OCI media types + crane validate)
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./scripts/assert_oci_registry.sh "$IMAGE:$VERSION"
          crane validate --remote "$IMAGE:$VERSION"
          released="$(crane digest "$IMAGE:$VERSION")"
          latest="$(crane digest "$IMAGE:latest")"
          if [ "$released" != "$latest" ]; then
            echo "FAIL: $IMAGE:latest is $latest, expected the $VERSION digest $released" >&2
            exit 1
          fi
          echo "OK: $IMAGE:$VERSION and :latest both resolve to $released"
