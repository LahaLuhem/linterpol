name: Regenerate LINTERS.md

# When the Dockerfile's tool set changes, the generated table in LINTERS.md goes stale and
# test.yml's `gen-linters.sh --check` fails. This regenerates it and commits it back with the
# lahaluhem-ci-bot App token, via the GitHub API rather than `git commit`: main requires verified
# signatures, an App token can't sign locally, and API-created commits are signed by GitHub. An
# App-token commit (unlike a GITHUB_TOKEN one) re-triggers workflows, so the drift check clears itself.
#
# Two entry points, both filtered to Dockerfile edits:
#   - pull_request: Renovate's bumps and manual tool-add PRs. The fix is committed back to the
#     PR branch. Gated to same-repo branches: a fork can't push a branch into this repo, and
#     pull_request hands forks no secrets anyway, so PR-head code can't read the App key. A
#     same-repo branch already implies write access (a trusted collaborator).
#   - push to main: direct commits (this repo is developed on main). The fix is committed to main.
#
# No loop: the regen commit only touches LINTERS.md, so the `paths: [images/*/Dockerfile]` filter doesn't
# re-trigger this workflow; the `git diff --quiet` guard is a second backstop.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - images/*/Dockerfile
  push:
    branches:
      - main
    paths:
      - images/*/Dockerfile

# Don't pile up regen runs when a branch gets several pushes in a row.
concurrency:
  group: linters-regen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The push is done with the App token; GITHUB_TOKEN itself needs nothing beyond read.
permissions:
  contents: read

jobs:
  regen:
    # PRs: same-repo branches only (forks excluded). Pushes to main are inherently in-repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mint lahaluhem-ci-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # No write token here: the commit goes through the API below, not `git push`.
      - name: Checkout the target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Regenerate LINTERS.md from the Dockerfile
        run: ./scripts/gen-linters.sh

      - name: Commit back if the table changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- LINTERS.md; then
            echo "LINTERS.md already in sync with the Dockerfile; nothing to commit."
            exit 0
          fi
          # Assign first: a bare $(...) inside the gh args would send an empty body on failure
          # instead of aborting. `sha` is the blob being replaced, which is the version at HEAD.
          content="$(base64 -w0 LINTERS.md)"
          blob="$(git rev-parse HEAD:LINTERS.md)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/LINTERS.md" \
            -f message='chore: regenerate LINTERS.md' \
            -f content="${content}" \
            -f sha="${blob}" \
            -f branch="${TARGET_REF}" >/dev/null
