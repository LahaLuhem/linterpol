name: Regenerate LINTERS.md

# When Renovate bumps a tool's FROM tag (or the container-structure-test version ARG), the
# generated table in LINTERS.md goes stale and test.yml's `gen-linters.sh --check` fails the PR.
# This regenerates the table and commits it back to the Renovate PR using the lahaluhem-ci-bot
# App token. An App-token push (unlike a GITHUB_TOKEN push) re-triggers workflows, so test.yml
# re-runs and the drift check clears on its own.
#
# Plain pull_request (not pull_request_target): Renovate isn't special-cased the way Dependabot
# is, so a pull_request run on Renovate's same-repo PR can read the App secrets and push back.
# That avoids the pull_request_target footgun (running PR-head code with base-repo secrets). We
# still gate to renovate[bot]'s own PRs (which only edit the Dockerfile, per the paths filter);
# the branch lives in this repo (the Mend app pushes it), so a third party can't inject code.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Dockerfile

# Don't pile up regen runs on a PR that gets several pushes in a row.
concurrency:
  group: linters-regen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The push is done with the App token; GITHUB_TOKEN itself needs nothing beyond read.
permissions:
  contents: read

jobs:
  regen:
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mint lahaluhem-ci-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout the PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Regenerate LINTERS.md from the Dockerfile
        run: ./scripts/gen-linters.sh

      - name: Commit back if the table changed
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- LINTERS.md; then
            echo "LINTERS.md already in sync with the Dockerfile; nothing to commit."
            exit 0
          fi
          # The numeric prefix is the bot's GitHub user id (stable per App) so the commit
          # links to lahaluhem-ci-bot's avatar.
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "287673903+${APP_SLUG}[bot]@users.noreply.github.com"
          git add LINTERS.md
          git commit -m 'chore: regenerate LINTERS.md for dependency bump'
          git push origin "HEAD:${HEAD_REF}"
