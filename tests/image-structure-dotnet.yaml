# Spec for linterpol-dotnet. It ships no container-structure-test, so test.sh runs the lean image's
# against this one's tarball. The tar driver can't run commands, so the Dockerfile's format check and
# the self-check CMD cover that.
schemaVersion: "2.0.0"

metadataTest:
  user: "10001"
  workdir: "/work"
  entrypoint: []

fileExistenceTests:
  - name: csharpier on PATH
    path: /usr/local/bin/csharpier
    shouldExist: true
    isExecutableBy: any
  - name: CSharpier payload present (the DLL the wrapper runs)
    path: /opt/csharpier/CSharpier.dll
    shouldExist: true
  - name: dotnet host on PATH
    path: /usr/bin/dotnet
    shouldExist: true
    isExecutableBy: any
