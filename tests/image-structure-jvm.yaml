# Spec for linterpol-jvm. It ships no container-structure-test, so test.sh runs the lean image's
# against this one's tarball. The tar driver can't run commands, so the self-check CMD covers that.
schemaVersion: "2.0.0"

metadataTest:
  user: "10001"
  workdir: "/work"
  entrypoint: []

fileExistenceTests:
  - name: ktlint on PATH
    path: /usr/local/bin/ktlint
    shouldExist: true
    isExecutableBy: any
  - name: detekt on PATH
    path: /usr/local/bin/detekt
    shouldExist: true
    isExecutableBy: any
  - name: java present (Temurin JRE)
    path: /opt/java/openjdk/bin/java
    shouldExist: true
    isExecutableBy: any
