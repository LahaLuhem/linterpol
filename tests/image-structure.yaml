# container-structure-test spec, run by test.yml against the freshly built image with the tar
# driver (no Docker socket needed). It dogfoods the bundled container-structure-test and locks the
# invocation contract chrysalis relies on: every tool sits on PATH under /usr/local/bin, the image
# runs as the non-root `lint` user from /work, and there is NO entrypoint wrapper (so
# `docker run <img> <tool> <args>` works). The tar driver can't execute commands, so "do the tools
# actually run" is covered separately by test.yml's lint steps and the image's own self-check CMD.
schemaVersion: "2.0.0"

metadataTest:
  user: "lint"
  workdir: "/work"
  entrypoint: []

fileExistenceTests:
  - name: hadolint on PATH
    path: /usr/local/bin/hadolint
    shouldExist: true
    isExecutableBy: any
  - name: actionlint on PATH
    path: /usr/local/bin/actionlint
    shouldExist: true
    isExecutableBy: any
  - name: shellcheck on PATH
    path: /usr/local/bin/shellcheck
    shouldExist: true
    isExecutableBy: any
  - name: ruff on PATH
    path: /usr/local/bin/ruff
    shouldExist: true
    isExecutableBy: any
  - name: swiftlint on PATH
    path: /usr/local/bin/swiftlint
    shouldExist: true
    isExecutableBy: any
  - name: rumdl on PATH
    path: /usr/local/bin/rumdl
    shouldExist: true
    isExecutableBy: any
  - name: container-structure-test on PATH
    path: /usr/local/bin/container-structure-test
    shouldExist: true
    isExecutableBy: any
