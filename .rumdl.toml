# rumdl config for linting this repo's own Markdown. test.yml dogfoods it via the lean image
# (`rumdl check .`); repos consuming the published image bring their own config.

[global]
# .ai/ holds the real AGENTS.md/CLAUDE.md that the root paths symlink to. Linting them there
# reports false-positive relative-link errors, since their ./APPENDIX.md etc. resolve from the
# repo root, not from .ai/. LINTERS.md is generated by scripts/gen-linters.sh, so its table
# spacing isn't ours to hand-fix.
exclude = [".ai", "LINTERS.md"]

# Both fire on deliberate conventions: the <a id="..."> section anchors and <details> blocks in
# the docs (MD033), and APPENDIX.md's anchors sitting directly above their headings (MD022).
disable = ["MD033", "MD022"]

[MD013]
# The docs wrap around 100 columns; 120 leaves headroom without policing prose to the byte.
# Code blocks and tables routinely run wider, so don't length-check those.
line_length = 120
code_blocks = false
tables = false
